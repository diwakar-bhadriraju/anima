# ANIMA v2 arm: v2-nom2 (docs/anima-v2-protocol.md §13/14)
# All frozen parameters identical; exactly the mechanism(s) above disabled.

[run]
exp_id = "v2-nom2"
seed = 20260912          # same seed as E1/E2 arms
viz_port = 8788
ticks_per_sec = 1000.0
stats_decimate = 10

[organism]
n_input_channels = 24
group_size = 8
n_internal = 40
n_output = 12
connectivity = 0.038
w_init = 0.2
amplitude = 52.0
adaptation_tau_ms = 200.0
adaptation_gain = 0.05

[plasticity]
rule = "stdp-pairwise"   # E1 additive rule: homeostasis isolated (U1 first)
tau_plus_ms = 20.0
tau_minus_ms = 20.0
a_plus = 0.005
a_minus = 0.0053
w_min = 0.0
w_max = 1.0
decay = 1e-6
silence_w = 0.02
silence_ticks = 60000
min_age_ticks = 30000
gate = "always"

[structural]
birth_trigger = "none"
dormancy_rate_hz = 0.1
dormancy_ms = 30000
recovery_rate_hz = 1.0
retirement_ms = 300000
wiring_synapses = 20

[resources]
max_neurons = 200
max_synapses = 2000
births_per_window = 4
runaway_rate_hz = 50.0   # E1/E2a threshold (A1 raised it only for E2b)
runaway_sustained_ms = 5000
fragmentation_min_component = 0.6

[[pattern]]
id = "A"
channels = ["A"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[pattern]]
id = "B"
channels = ["B"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[pattern]]
id = "C"
channels = ["C"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[pattern]]
id = "D"
channels = ["A", "C"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[stage]]
id = "S0"
present = []
reps = 0
order = "interleaved"
off_ms = 0
silence_ms = 5000

[[stage]]
id = "S1"
present = ["A", "B", "C"]
reps = 120
order = "interleaved"
off_ms = 1500

[[stage]]
id = "S2"
present = ["D"]
reps = 30
order = "blocked"
off_ms = 1500

[[stage]]
id = "S3"
present = ["A", "B", "C"]
reps = 15
order = "interleaved"
off_ms = 1500
[v2]
enabled = true
disable_m2 = true

# M1 — dense-weak initialization
p_in = 0.5
w_in_lo = 0.02
w_in_hi = 0.06
p_rec = 0.2
w_rec_lo = 0.005
w_rec_hi = 0.02

# M2 — normalization
t_e = 0.8

# M3 — candidates
c_slots = 6
w_c_init = 0.01
delta_perm = 0.005
decay_c = 0.9
theta_permanent = 0.05
w_c_permanent = 0.02
theta_die = 0.005
p_cand_in = 0.5
p_cand_rec = 0.5

# M4 — pruning
theta_prune = 0.005
prune_windows = 10

# M5 — budgets
b_e = 40
b_i = 10

# M6 — anti-Hebbian inhibition
p_inh = 0.3
w_inh_lo = 0.01
w_inh_hi = 0.03
a_inh = 0.005
decay_inh = 0.98
w_inh_max = 0.10

# structural window
window_ticks = 100
