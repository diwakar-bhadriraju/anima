# E3 Arm B — U1 spike-frequency adaptation ON (docs/e3-protocol-draft.md)
# Only delta vs E1 base: adaptation_tau_ms / adaptation_gain.
# Gain 0.05 chosen from calibration sweep (amendment A2): burst peaks
# ~148 Hz, inside the pre-registered 100-200 Hz band.

[run]
exp_id = "e3b"
seed = 20260912          # same seed as E1/E2 arms
viz_port = 8788
ticks_per_sec = 1000.0
stats_decimate = 10

[organism]
n_input_channels = 24
group_size = 8
n_internal = 40
n_output = 12
connectivity = 0.038
w_init = 0.2
amplitude = 52.0
adaptation_tau_ms = 200.0
adaptation_gain = 0.05

[plasticity]
rule = "stdp-pairwise"   # E1 additive rule: homeostasis isolated (U1 first)
tau_plus_ms = 20.0
tau_minus_ms = 20.0
a_plus = 0.005
a_minus = 0.0053
w_min = 0.0
w_max = 1.0
decay = 1e-6
silence_w = 0.02
silence_ticks = 60000
min_age_ticks = 30000
gate = "always"

[structural]
birth_trigger = "none"
dormancy_rate_hz = 0.1
dormancy_ms = 30000
recovery_rate_hz = 1.0
retirement_ms = 300000
wiring_synapses = 20

[resources]
max_neurons = 200
max_synapses = 2000
births_per_window = 4
runaway_rate_hz = 50.0   # E1/E2a threshold (A1 raised it only for E2b)
runaway_sustained_ms = 5000
fragmentation_min_component = 0.6

[[pattern]]
id = "A"
channels = ["A"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[pattern]]
id = "B"
channels = ["B"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[pattern]]
id = "C"
channels = ["C"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[pattern]]
id = "D"
channels = ["A", "C"]
rate_hz = 20.0
duration_ms = 500
jitter_ms = 2.0

[[stage]]
id = "S0"
present = []
reps = 0
order = "interleaved"
off_ms = 0
silence_ms = 5000

[[stage]]
id = "S1"
present = ["A", "B", "C"]
reps = 120
order = "interleaved"
off_ms = 1500

[[stage]]
id = "S2"
present = ["D"]
reps = 30
order = "blocked"
off_ms = 1500

[[stage]]
id = "S3"
present = ["A", "B", "C"]
reps = 15
order = "interleaved"
off_ms = 1500
