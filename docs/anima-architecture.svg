<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="Inter, Segoe UI, -apple-system, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#e6e8ef"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1c2733" flood-opacity="0.12"/>
    </filter>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b6682"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7aa6d6"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6fb5"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fb08a"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #172433; }
      .sub   { font-size: 13px; fill: #6b7a8c; }
      .panel { fill: #f7f9fc; stroke: #dfe6f0; stroke-dasharray: 6 5; stroke-width: 1.5; }
      .phead { font-size: 12px; font-weight: 700; letter-spacing: .12em; fill: #93a2b4; }
      .card  { filter: url(#shadow); }
      .cardt { font-size: 14px; font-weight: 700; }
      .bod   { font-size: 12px; }
      .lit   { font-size: 11px; font-style: italic; }
      .edge  { fill: none; stroke-width: 2.2; }
      .lbl   { font-size: 11px; fill: #5a6a7c; font-style: italic; }
      .foot  { font-size: 12px; fill: #5a6a7c; }
    </style>
  </defs>

  <rect width="1120" height="660" fill="#fbfcfe"/>
  <rect width="1120" height="660" fill="url(#dots)"/>

  <text x="26" y="34" class="title">ANIMA architecture</text>
  <text x="26" y="56" class="sub">a self-organizing spiking neural organism · version 0.1.0</text>

  <rect class="panel" x="20" y="86" width="330" height="452" rx="16"/>
  <text x="40" y="112" class="phead">THE AGENT</text>

  <rect class="panel" x="384" y="86" width="324" height="452" rx="16"/>
  <text x="404" y="112" class="phead">THE WORLD</text>

  <rect class="panel" x="742" y="86" width="356" height="452" rx="16"/>
  <text x="762" y="112" class="phead">SELECTION + CONTROL</text>

  <!-- Sensors -->
  <rect class="card" x="44" y="130" width="282" height="104" rx="12" fill="#e9f2fc" stroke="#7aa6d6" stroke-width="1.8"/>
  <rect x="44" y="130" width="282" height="5" rx="2.5" fill="#7aa6d6"/>
  <text x="66" y="160" class="cardt" fill="#24507e">Sensors</text>
  <text x="66" y="182" class="bod" fill="#3a5d84">retina grid (48)</text>
  <text x="66" y="200" class="bod" fill="#3a5d84">proprioception (8)</text>
  <text x="66" y="218" class="bod" fill="#3a5d84">smell (optional, 6)</text>

  <!-- Brain -->
  <rect class="card" x="44" y="252" width="282" height="150" rx="12" fill="#eef1f5" stroke="#8b98a8" stroke-width="1.8"/>
  <rect x="44" y="252" width="282" height="5" rx="2.5" fill="#8b98a8"/>
  <text x="66" y="282" class="cardt" fill="#37424e">Brain · spiking LIF</text>
  <text x="66" y="304" class="bod" fill="#4a5766">inputs (poisson)</text>
  <text x="66" y="322" class="bod" fill="#4a5766">internal pool 40 / 128 / 256</text>
  <text x="66" y="340" class="bod" fill="#4a5766">STDP + structural plasticity</text>
  <text x="66" y="358" class="bod" fill="#4a5766">12 motor outputs</text>
  <text x="66" y="384" class="lit" fill="#71808f">rewires itself; no hand-design</text>

  <!-- Home -->
  <rect class="card" x="44" y="420" width="282" height="88" rx="12" fill="#ecf6ee" stroke="#66a87a" stroke-width="1.8"/>
  <rect x="44" y="420" width="282" height="5" rx="2.5" fill="#66a87a"/>
  <text x="66" y="450" class="cardt" fill="#2c6a40">Home / rest (optional)</text>
  <text x="66" y="472" class="bod" fill="#3f7d55">nest landmark · stamina</text>
  <text x="66" y="490" class="lit" fill="#6f9d80">return to rest, recover</text>

  <!-- World -->
  <rect class="card" x="408" y="130" width="276" height="150" rx="12" fill="#eaf6f0" stroke="#5fb08a" stroke-width="1.8"/>
  <rect x="408" y="130" width="276" height="5" rx="2.5" fill="#5fb08a"/>
  <text x="430" y="160" class="cardt" fill="#1f6b47">3D world</text>
  <text x="430" y="182" class="bod" fill="#2f7a55">body · pose + heading</text>
  <text x="430" y="200" class="bod" fill="#2f7a55">arena 100 x 100, gravity</text>
  <text x="430" y="218" class="bod" fill="#2f7a55">food patches (+30 energy)</text>
  <text x="430" y="236" class="bod" fill="#2f7a55">energy tank, death at 0</text>
  <text x="430" y="262" class="lit" fill="#6fa287">steps per beat; source of reward</text>

  <!-- Evolution -->
  <rect class="card" x="766" y="130" width="308" height="118" rx="12" fill="#f3eefb" stroke="#8a6fb5" stroke-width="1.8"/>
  <rect x="766" y="130" width="308" height="5" rx="2.5" fill="#8a6fb5"/>
  <text x="788" y="160" class="cardt" fill="#5b3f8a">Evolution · genetic algorithm</text>
  <text x="788" y="182" class="bod" fill="#6d529e">4 creatures per generation</text>
  <text x="788" y="200" class="bod" fill="#6d529e">score = fitness (food + life)</text>
  <text x="788" y="218" class="bod" fill="#6d529e">best breed · mutations</text>
  <text x="788" y="236" class="lit" fill="#8f7ab5">selects across generations</text>

  <!-- Determinism -->
  <rect class="card" x="766" y="266" width="308" height="96" rx="12" fill="#ffffff" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="788" y="294" class="cardt" fill="#8a6b12">Determinism · control</text>
  <text x="788" y="316" class="bod" fill="#7a6a20">seeded (same seed = same run)</text>
  <text x="788" y="334" class="bod" fill="#7a6a20">env-gated, frozen identity</text>
  <text x="788" y="352" class="lit" fill="#a28f45">keeps every result re-runnable</text>

  <!-- edges (labeled) -->
  <g>
    <path class="edge" stroke="#7aa6d6" marker-end="url(#arr-s)" d="M408 172 C 320 152, 200 165, 326 200"/>
    <text x="292" y="176" class="lbl">sense</text>
    <path class="edge" stroke="#8b98a8" d="M185 234 L 185 252" marker-end="url(#arr-b)"/>
    <text x="198" y="248" class="lbl">encode</text>
    <path class="edge" stroke="#5fb08a" d="M326 290 L 408 200" marker-end="url(#arr-g)"/>
    <text x="352" y="250" class="lbl">motor</text>
    <path class="edge" stroke="#66a87a" d="M185 420 L 185 402" marker-end="url(#arr-b)"/>
    <text x="198" y="414" class="lbl">rest</text>
    <path class="edge" stroke="#8a6fb5" marker-end="url(#arr-p)" d="M684 200 C 706 180, 735 170, 766 180"/>
    <text x="702" y="172" class="lbl">fitness</text>
    <path class="edge" stroke="#8a6fb5" marker-end="url(#arr-p)" d="M326 290 C 440 360, 600 356, 766 200"/>
    <text x="520" y="366" class="lbl">wiring (parent → offspring)</text>
  </g>

  <rect x="26" y="588" width="1068" height="46" rx="10" fill="#ffffff" stroke="#e3e8f0" stroke-width="1.4"/>
  <text x="44" y="607" class="phead">LOOP</text>
  <text x="44" y="625" class="foot">sense → think → act → survive (or die) → repeat. The brain rewires inside a life;</text>
  <text x="44" y="633" class="foot" dy="0" fill="#5a6a7c"></text>
  <text x="1000" y="625" class="foot" fill="#93a2b4">editable: docs/anima-architecture.drawio</text>
</svg>