<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .box { fill: #fffdf7; stroke: #36454f; stroke-width: 2.2; }
      .sens { fill: #eef3f8; stroke: #5b7a9d; }
      .world { fill: #f9f5ec; stroke: #8a7a3c; }
      .home { fill: #eef6ef; stroke: #5c8a5c; }
      .evo { fill: #f3eefb; stroke: #7a5c9e; }
      .det { fill: #ffffff; stroke: #c9a227; stroke-dasharray: 5 4; }
      .line { stroke: #5b7a9d; stroke-width: 2.2; fill: none; }
      .line2 { stroke: #36454f; stroke-width: 2.2; fill: none; }
      .line3 { stroke: #5c8a5c; stroke-width: 2.2; fill: none; }
      .line4 { stroke: #7a5c9e; stroke-width: 2.2; fill: none; }
      .arrow { fill: none; }
      .t { font-size: 14px; fill: #20303c; }
      .ts { font-size: 12.5px; fill: #445c6e; }
      .hl { font-size: 16px; font-weight: 600; fill: #20303c; }
      .ht { font-size: 21px; font-weight: 700; fill: #182733; }
    </style>
  </defs>

  <text x="20" y="38" class="ht">ANIMA architecture</text>

  <!-- Sensors -->
  <rect class="box sens" x="30" y="120" width="220" height="120" rx="12"/>
  <text x="140" y="148" text-anchor="middle" class="hl">Sensors</text>
  <text x="140" y="172" text-anchor="middle" class="t">retina grid (48)</text>
  <text x="140" y="192" text-anchor="middle" class="t">proprioception (8)</text>
  <text x="140" y="212" text-anchor="middle" class="t">smell (optional, 6)</text>

  <!-- Brain -->
  <rect class="box" x="30" y="290" width="220" height="195" rx="12"/>
  <text x="140" y="318" text-anchor="middle" class="hl">Brain (spiking LIF)</text>
  <text x="140" y="342" text-anchor="middle" class="t">inputs (poisson)</text>
  <text x="140" y="362" text-anchor="middle" class="t">internal pool (40/128/256)</text>
  <text x="140" y="382" text-anchor="middle" class="t">STDP + structural growth</text>
  <text x="140" y="402" text-anchor="middle" class="t">outputs (12 motor)</text>
  <text x="140" y="430" text-anchor="middle" class="ts">changes its own wiring</text>
  <text x="140" y="448" text-anchor="middle" class="ts">inside each life</text>

  <!-- World -->
  <rect class="box world" x="430" y="300" width="280" height="190" rx="12"/>
  <text x="570" y="330" text-anchor="middle" class="hl">3D world</text>
  <text x="570" y="354" text-anchor="middle" class="t">body (position, heading, pitch, velocity)</text>
  <text x="570" y="376" text-anchor="middle" class="t">arena 100 x 100, gravity, ground</text>
  <text x="570" y="398" text-anchor="middle" class="t">food patches (+30 energy)</text>
  <text x="570" y="420" text-anchor="middle" class="t">energy tank, death at 0</text>
  <text x="570" y="450" text-anchor="middle" class="ts">steps once per beat</text>

  <!-- Home -->
  <rect class="box home" x="30" y="520" width="220" height="80" rx="12"/>
  <text x="140" y="550" text-anchor="middle" class="hl">Home / rest (optional)</text>
  <text x="140" y="572" text-anchor="middle" class="t">nest landmark, stamina</text>
  <text x="140" y="590" text-anchor="middle" class="ts">return to rest and recover</text>

  <!-- Evolution -->
  <rect class="box evo" x="860" y="300" width="210" height="190" rx="12"/>
  <text x="965" y="330" text-anchor="middle" class="hl">Evolution (GA)</text>
  <text x="965" y="354" text-anchor="middle" class="t">4 creatures per generation</text>
  <text x="965" y="376" text-anchor="middle" class="t">score = fitness (food + life)</text>
  <text x="965" y="398" text-anchor="middle" class="t">best breed, mutations</text>
  <text x="965" y="420" text-anchor="middle" class="t">next generation of brains</text>
  <text x="965" y="450" text-anchor="middle" class="ts">selection + variation</text>

  <!-- Determinism -->
  <rect class="box det" x="860" y="130" width="210" height="105" rx="12"/>
  <text x="965" y="160" text-anchor="middle" class="hl">Determinism</text>
  <text x="965" y="184" text-anchor="middle" class="t">seeded randomness</text>
  <text x="965" y="204" text-anchor="middle" class="t">env-gated switches</text>
  <text x="965" y="224" text-anchor="middle" class="t">same seed = same run</text>

  <!-- edges -->
  <path class="line" d="M430 330 C 330 250, 250 210, 250 190"/>
  <polygon class="arrow" points="248,182 264,192 252,198"/>
  <path class="line2" d="M140 240 L 140 290"/>
  <polygon class="arrow" points="140,298 133,286 147,286"/>
  <path class="line2" d="M250 340 C 320 350, 350 360, 430 375"/>
  <polygon class="arrow" points="440,377 424,380 430,369"/>
  <path class="line3" d="M140 520 L 140 485"/>
  <polygon class="arrow" points="140,477 133,489 147,489"/>
  <path class="line4" d="M710 340 C 770 310, 800 300, 860 300"/>
  <polygon class="arrow" points="868,299 852,295 862,306"/>
  <path class="line4" d="M250 400 C 420 420, 620 400, 860 360"/>
  <polygon class="arrow" points="868,358 852,361 859,350"/>

  <!-- caption -->
  <text x="30" y="628" class="ts">loop: sense, think, act, survive or die, repeat. The brain changes its wiring inside a life; the population changes across generations.</text>
</svg>